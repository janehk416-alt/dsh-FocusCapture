changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚀 Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "🧪 Tests & Maintenance"
      labels:
        - tests
        - maintenance
        - dependencies
    - title: "Other Changes"
      labels:
        - "*"
